# Open5GS NWDAF configuration (/etc/open5gs/nwdaf.yaml).
#
# [R] marks the settings `systemctl reload open5gs-nwdafd` (SIGHUP) applies;
# every other setting needs a restart. Commented-out settings show their
# default or an example. The README's Configuration table has the details.
nwdaf:

  # ── Identity ──────────────────────────────────────────────────────────────
  nf_instance_id: "198e9234-b849-42a2-9f70-d9a587616c2b"  # this NWDAF's NF instance ID (UUID, kept stable)
  plmn_mcc: "999"                       # PLMN of the core (amf.yaml plmn_id)
  plmn_mnc: "70"
  # open5gs_version: "2.8.0"            # the core's Open5GS version (workarounds verified on 2.8.0)

  # ── SBI listeners ─────────────────────────────────────────────────────────
  sbi_bind_address: "127.0.0.1"         # address both listeners bind to
  sbi_port: 7779                        # operator API and dashboard, HTTP/1.1 (not 7777: Open5GS uses it)
  sbi_h2_port: 7780                     # 3GPP Nnwdaf interfaces over HTTP/2; 0 = off (dev-legacy, non-compliant)

  # ── NRF (TS 29.510) ───────────────────────────────────────────────────────
  nrf_uri: "http://127.0.0.10:7777"     # the NRF (Open5GS default address; it needs HTTP/2)
  nrf_register_on_startup: true         # NFRegister at start, NFDeregister at stop
  nrf_heartbeat_interval_seconds: 60    # heartbeat period (the NRF may assign another); 0 = no heartbeat
  nrf_nf_discovery: false               # poll the NRF for NF instance IDs and status (enables NF_LOAD)
  nrf_nf_discovery_interval_seconds: 60 # how often it polls
  nrf_nf_status_window_seconds: 3600    # period NF_LOAD nfStatus percentages cover

  # ── Data sources (Open5GS) ────────────────────────────────────────────────
  nf_service_names:                     # NF type → systemd unit suffix (open5gs-<name>), for NF health and CPU
    AMF:  "amfd"
    SMF:  "smfd"
    UPF:  "upfd"
    AUSF: "ausfd"
    UDM:  "udmd"
    PCF:  "pcfd"
    NRF:  "nrfd"
    UDR:  "udrd"
    BSF:  "bsfd"
    NSSF: "nssfd"
  # oam_metrics_endpoints:              # [R] each NF's Prometheus metrics (UEs/sessions per slice, session counters)
  #   AMF: "http://127.0.0.5:9090/metrics"
  #   SMF: "http://127.0.0.4:9090/metrics"
  #   UPF: "http://127.0.0.7:9090/metrics"
  #   PCF: "http://127.0.0.13:9090/metrics"
  # amf_ue_info_endpoint: "http://127.0.0.5:9090/ue-info"  # [R] AMF per-UE list (UE locations; has SUPIs)
  throughput_interfaces: ["ogstun"]     # UPF tunnel interfaces whose /sys counters give throughput
  collection_interval_seconds: 10       # [R] sampling period of every source
  throughput_history_size: 360          # samples kept per series (360 × 10 s = 1 h)
  amf_journal_lines: 500                # journald lines read per tick from the AMF
  smf_journal_lines: 500                # and from the SMF
  supi_regex: "imsi-(\\d{15})"          # extracts the SUPI from Open5GS log lines
  mongodb_uri: "mongodb://127.0.0.1:27017"  # Open5GS subscriber database (subscriber count)
  mongodb_db:  "open5gs"

  # ── Rel-18 analytics capability ───────────────────────────────────────────
  # Each enables the analytics whose inputs it provides (README, Open5GS compatibility).
  # nf_instance_ids:                    # [R] NF type → its NRF nfInstanceId (enables NF_LOAD without NRF polling)
  #   AMF: "<amf nfInstanceId>"
  # slice_capacity:                     # [R] per-S-NSSAI admission maxima: slice/NSI load level = occupancy (I-9)
  #   - snssai: {sst: 1, sd: "000001"}
  #     max_ues: 1000
  #     max_pdu_sessions: 2000
  # served_tai_list:                    # [R] the TAIs the core serves (amf.yaml tai); tac unquoted = decimal,
  #   - {tac: 1}                        #     quoted 4/6 digits = hex; mcc/mnc default to plmn_mcc/plmn_mnc
  # slice_load_window_seconds: 300          # [R] SLICE/NSI_LOAD_LEVEL period when the request gives none
  # network_performance_window_seconds: 300 # [R] NETWORK_PERFORMANCE period when the request gives none
  # ue_mobility_window_seconds: 3600        # [R] UE_MOBILITY period when the request gives none
  # ue_location_history_seconds: 86400      # how long UE locations are kept (memory only)
  # prediction_horizon_seconds: 900         # [R] how far ahead predictions may reach; 0 = no predictions (I-13)
  # prediction_min_samples: 10              # [R] fewer samples give a prediction with confidence 0
  # prediction_tolerance: 10                # [R] error (points) a prediction's confidence counts as correct

  # ── ML (operator API analytics) ───────────────────────────────────────────
  model_dir: "/opt/nwdaf/models"        # where the anomaly model is saved
  anomaly_contamination: 0.10           # [R] expected share of anomalies (Isolation Forest)
  anomaly_seed: 0                       # model seed for reproducible training; 0 = random
  anomaly_min_samples: 120              # samples needed before training (120 × 10 s = 20 min)
  baseline_stddev_min_kbps: 0.5         # below this throughput spread, ABNORMAL_BEHAVIOUR reports BASELINE_TOO_LOW
  ewma_alpha: 0.3                       # [R] EWMA smoothing (0 = never adapts, 1 = last sample only)
  network_performance_weights:          # operator-API NETWORK_PERFORMANCE score weights, summing to 1.0
    nf_health: 0.6                      # share of NFs active
    dl_score:  0.2                      # downlink throughput (capped at 100)
    pdu_score: 0.2                      # active PDU sessions (capped at 100)

  # ── Logging and persistence ───────────────────────────────────────────────
  log_level: "info"                     # [R] trace, debug, info, warn or error
  log_file: "/var/log/open5gs/nwdaf.log"  # log file, besides the console
  history_backend: "sqlite"             # "sqlite": history and subscriptions survive restarts; "none": memory only
  history_db_path: "/opt/nwdaf/history.db"

  # ── Security ──────────────────────────────────────────────────────────────
  tls_enabled: false                    # TLS on both listeners (build with TLS; the rel18 profile)
  tls_cert_file: "/etc/open5gs/tls/nwdaf.pem"   # server certificate
  tls_key_file:  "/etc/open5gs/tls/nwdaf.key"   # its private key
  tls_ca_file:   "/etc/open5gs/tls/ca.pem"      # when set: mTLS, clients need a certificate from this CA
  # oauth_enabled: false                # OAuth 2.0 tokens on the 3GPP interfaces (Open5GS has no token issuer)
  # oauth_nrf_public_key_file: ""       # the NRF's token-signing public key (RS256/ES256)
  # oauth_shared_secret_file: ""        # or a secret shared with the NRF (HS256)
  rate_limit_per_ip_rps: 10             # requests/s allowed per client IP; 0 = no limit
  rate_limit_global_rps: 100            # requests/s allowed in total; 0 = no limit

  # ── API documents ─────────────────────────────────────────────────────────
  openapi_spec_path: "/etc/open5gs/openapi/nwdaf-analytics-v1.yaml"  # served at /nwdaf-analytics/v1/openapi
  openapi_3gpp_dir: "/etc/open5gs/openapi/3gpp"  # official 3GPP files requests are validated against (missing = 500)
