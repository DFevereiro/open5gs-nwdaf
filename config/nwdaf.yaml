nwdaf:
  # NF identity
  nf_instance_id: "198e9234-b849-42a2-9f70-d9a587616c2b"  # stable — do not regenerate
  plmn_mcc: "999"
  plmn_mnc: "70"
  sbi_bind_address: "127.0.0.1"
  sbi_port: 7779              # Operator API + dashboard (HTTP/1.1). Must not conflict with Open5GS (7777)
  sbi_h2_port: 7780           # 3GPP interfaces over HTTP/2 (TS 29.500); 0 disables

  # Open5GS NF service names (systemd unit suffix after 'open5gs-')
  # Adjust for your Open5GS version if needed
  nf_service_names:
    AMF:  "amfd"
    SMF:  "smfd"
    UPF:  "upfd"
    AUSF: "ausfd"
    UDM:  "udmd"
    PCF:  "pcfd"
    NRF:  "nrfd"
    UDR:  "udrd"
    BSF:  "bsfd"
    NSSF: "nssfd"

  # NF instance IDs (the nfInstanceId each Open5GS NF registers with the NRF).
  # Required for Rel-18 NF_LOAD on the 3GPP interfaces: NF_LOAD is advertised
  # only when this map is set. Use your deployment's real IDs — never
  # placeholders, or the NWDAF would report load for NF instances that do not
  # exist. Keys must appear in nf_service_names.
  # nf_instance_ids:
  #   AMF: "<amf nfInstanceId>"
  #   SMF: "<smf nfInstanceId>"
  #   UPF: "<upf nfInstanceId>"
  # Or poll the NRF (NFListRetrieval + NFProfileRetrieval) every interval:
  # resolves the types without a configured ID (only when exactly one instance
  # of the type is registered) and reports each NF's NRF status (nfStatus)
  # over the status window.
  nrf_nf_discovery: false
  nrf_nf_discovery_interval_seconds: 60
  nrf_nf_status_window_seconds: 3600

  # Data collection — UPF tunnel interfaces for throughput measurement
  # gtp5g bypasses user-space capture; read /sys/class/net directly
  throughput_interfaces:
    - "ogstun"   # single-UE lab setup; ogstun2/3 don't exist
    - "ens4"
  throughput_history_size: 360      # 1 hour at 10s interval
  collection_interval_seconds: 10

  # OAM input: the NFs' Prometheus metrics endpoints (TS 28.552 measurement
  # names), scraped every collection interval. These are the Open5GS v2.8.0
  # defaults (metrics.server in each NF's YAML); they listen on loopback, so
  # a remote NWDAF needs the NFs' metrics address changed.
  # oam_metrics_endpoints:
  #   AMF: "http://127.0.0.5:9090/metrics"
  #   SMF: "http://127.0.0.4:9090/metrics"
  #   UPF: "http://127.0.0.7:9090/metrics"
  #   PCF: "http://127.0.0.13:9090/metrics"

  # Per-slice admission capacity, as an NSACF would be configured with it
  # (Open5GS has none). SLICE_LOAD_LEVEL / NSI_LOAD_LEVEL are served only for
  # these slices; load level = the higher of UEs ÷ max_ues and PDU sessions ÷
  # max_pdu_sessions, in percent (interpretation I-9). Use your real limits.
  # slice_capacity:
  #   - snssai: {sst: 1, sd: "000001"}
  #     max_ues: 1000
  #     max_pdu_sessions: 2000

  # AMF journald log parsing — Open5GS v2.7.6 uses "imsi-XXXXXXXXXXXXXXX"
  # Adjust supi_regex for earlier versions if needed
  amf_journal_lines: 500
  smf_journal_lines: 500
  supi_regex: "imsi-(\\d{15})"

  # MongoDB (for subscriber count via UDR/UDM)
  mongodb_uri: "mongodb://127.0.0.1:27017"
  mongodb_db:  "open5gs"

  # NRF registration + heartbeat (TS 29.510 §5.3.2.4)
  nrf_uri: "http://127.0.0.10:7777"  # Open5GS NRF binds to 127.0.0.10, not 127.0.0.1
  nrf_register_on_startup: true
  nrf_heartbeat_interval_seconds: 60   # TS 29.510 recommends ≤ 60s; 0 = disabled

  # ML
  model_dir: "/opt/nwdaf/models"
  anomaly_contamination: 0.10       # Expected fraction of anomalies
  anomaly_seed: 0                   # Seed for Isolation Forest reproducibility (0 = random)
  anomaly_min_samples: 120          # ~20 min at 10s interval — matches retrain() quality gate
  baseline_stddev_min_kbps: 0.5     # Below this, return BASELINE_TOO_LOW
  ewma_alpha: 0.3                   # EWMA smoothing factor (0=no adaptation, 1=instant)

  # Logging
  log_level: "info"                 # trace|debug|info|warn|error
  log_file: "/var/log/open5gs/nwdaf.log"

  # PROD-01: throughput history + subscription persistence across restarts
  # Requires libsqlite3-dev; set to "none" to disable (in-memory only, original behaviour)
  history_backend: "sqlite"         # "none" | "sqlite"
  history_db_path: "/opt/nwdaf/history.db"

  # PROD-06: SBI endpoint rate limiting (token bucket per client IP + global)
  # Set to 0 to disable the respective limit
  rate_limit_per_ip_rps: 10         # max requests/s from a single client IP
  rate_limit_global_rps: 100        # max total requests/s across all clients

  # ARCH-03: NETWORK_PERFORMANCE scoring weights (must sum to 1.0 ± 0.001)
  network_performance_weights:
    nf_health: 0.6   # fraction of NFs in active state
    dl_score:  0.2   # downlink throughput score (capped at 100)
    pdu_score: 0.2   # active PDU session score  (capped at 100)

  # ARCH-05: TLS / mTLS for SBI interface (TS 33.501 §13.3)
  # Requires rebuilding with:  cmake -DNWDAF_USE_TLS=ON ..
  tls_enabled: false
  tls_cert_file: "/etc/open5gs/tls/nwdaf.pem"
  tls_key_file:  "/etc/open5gs/tls/nwdaf.key"
  tls_ca_file:   "/etc/open5gs/tls/ca.pem"   # optional — when set, mTLS: clients must present a cert signed by this CA

  # H1.6: OpenAPI document served from GET /nwdaf-analytics/v1/openapi.
  # Installed here by `make install`; if the file is missing the endpoint
  # returns 404 and the rest of the SBI is unaffected.
  openapi_spec_path: "/etc/open5gs/openapi/nwdaf-analytics-v1.yaml"
