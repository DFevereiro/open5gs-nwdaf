# UERANSIM gNB for the demo — UERANSIM's open5gs-gnb.yaml defaults, matching
# Open5GS v2.8.0's default AMF (PLMN 999-70, TAC 1, slice SST 1).
mcc: '999'
mnc: '70'
nci: '0x000000010'
idLength: 32
tac: 1
linkIp: 127.0.0.1
ngapIp: 127.0.0.1
gtpIp: 127.0.0.1
amfConfigs:
  - address: 127.0.0.5
    port: 38412
slices:
  - sst: 1
ignoreStreamIds: true
