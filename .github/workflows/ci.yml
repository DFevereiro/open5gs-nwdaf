name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Ubuntu 22.04 (GitHub-hosted runner) ──────────────────────────────────────
  build-2204:
    name: Ubuntu 22.04 · ${{ matrix.profile }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 ships OpenSSL 3.0, so TLS can be enabled here. This is the
          # main Rel-18 conformance job: HTTP/2 + TLS are required (H1.8), and
          # the 3GPP test suite runs over HTTP/2.
          - profile: full
            apt_optional: "libsystemd-dev libssl-dev libsqlite3-dev libnghttp2-dev libcurl4-openssl-dev"
            cmake_flags: "-DNWDAF_USE_SD_JOURNAL=ON -DNWDAF_USE_TLS=ON -DNWDAF_USE_HTTP2=ON -DNWDAF_REQUIRE_REL18_PROFILE=ON"
          # dev-legacy profile: HTTP/1.1 only (explicitly transport non-compliant).
          - profile: minimal
            apt_optional: ""
            cmake_flags: "-DNWDAF_USE_SD_JOURNAL=OFF -DNWDAF_USE_TLS=OFF -DNWDAF_USE_HTTP2=OFF"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git pkg-config ca-certificates \
            ${{ matrix.apt_optional }}

      - name: Configure
        run: |
          # Retry to ride out transient GitHub download failures during
          # CMake FetchContent (deps are fetched at configure time).
          for i in 1 2 3; do
            if cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DNWDAF_BUILD_TESTS=ON \
                ${{ matrix.cmake_flags }}; then
              exit 0
            fi
            echo "::warning::cmake configure attempt $i failed (likely transient FetchContent download); retrying"
            rm -rf build
            sleep $((i * 15))
          done
          echo "::error::cmake configure failed after 3 attempts"
          exit 1

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --timeout 120

      # QOL-04: the daemon with synthetic Open5GS data, queried through the
      # test tools, so they stay in step with the SBI and the collector.
      - name: Smoke test with the test tools
        if: matrix.profile == 'full'
        run: tools/nwdaf-local --build build --check

  # ── Ubuntu 20.04 (container — hosted 20.04 runners were retired) ──────────────
  build-2004:
    name: Ubuntu 20.04 · ${{ matrix.profile }}
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # 20.04 ships OpenSSL 1.1.1, which cpp-httplib's TLS support does not
          # accept (requires OpenSSL >= 3.0), so TLS is OFF here. sd-journal and
          # SQLite are still exercised.
          # HTTP/2 is exercised here too; TLS cannot be, so this job is not
          # eligible for the Rel-18 profile.
          - profile: full
            apt_optional: "libsystemd-dev libsqlite3-dev libnghttp2-dev libcurl4-openssl-dev"
            cmake_flags: "-DNWDAF_USE_SD_JOURNAL=ON -DNWDAF_USE_TLS=OFF -DNWDAF_USE_HTTP2=ON"
          - profile: minimal
            apt_optional: ""
            cmake_flags: "-DNWDAF_USE_SD_JOURNAL=OFF -DNWDAF_USE_TLS=OFF -DNWDAF_USE_HTTP2=OFF"
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install base toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git pkg-config ca-certificates \
            python3 python3-pip \
            ${{ matrix.apt_optional }}
          # Focal ships CMake 3.16; the project requires >= 3.22 — install a newer one via pip.
          # Pin to the 3.x series: CMake 4.x drops compatibility with the pre-3.5
          # cmake_minimum_required used by fetched deps (yaml-cpp 0.8.0).
          pip3 install --no-cache-dir "cmake>=3.22,<4"

      - uses: actions/checkout@v4

      - name: Configure
        run: |
          # Retry to ride out transient GitHub download failures during
          # CMake FetchContent (deps are fetched at configure time).
          for i in 1 2 3; do
            if cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DNWDAF_BUILD_TESTS=ON \
                ${{ matrix.cmake_flags }}; then
              exit 0
            fi
            echo "::warning::cmake configure attempt $i failed (likely transient FetchContent download); retrying"
            rm -rf build
            sleep $((i * 15))
          done
          echo "::error::cmake configure failed after 3 attempts"
          exit 1

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --timeout 120

  # ── Docker image build ───────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: open5gs-nwdaf:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify binary is present in the image
        run: docker run --rm --entrypoint test open5gs-nwdaf:ci -x /usr/local/bin/open5gs-nwdafd
